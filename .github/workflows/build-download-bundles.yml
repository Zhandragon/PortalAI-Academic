name: Build current download bundles
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: current-download-bundles
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            InstallerSources/Bundle
            InstallerSources/Tests
            InstallerSources/Windows
            InstallerSources/Models
            InstallerSources/Linux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild, verify reviewed contents and upload draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_download_bundles_ci.py
